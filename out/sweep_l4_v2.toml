# l=4 branch campaign (SAN-16 groundwork): from the w=0.9 seed through the
# omega_min turning point (paper Table IX.1: 
# omega_min turning point (paper Table IX.1) and through to psi0 = 0.6.
# ansatz recipe (see out/seed_scan.py; window scales ~x3 per l).
[campaign]
l = 4
direction = "up"
psi0_target = 0.6
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 4000
stop_at_turning_point = false

[seed]
policy = "solution"
source = "/workspace/rotboson/out/seeds/l=4,w=9.00000E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l4-v2"
format = "hdf5"
