# SAN-17 end-to-end validation: l=1 up-sweep through the minimum-omega
# turning point (paper Table IX.1: omega_min = 0.64561 at production res).
# Moderate grid: coarse enough to run here, fine enough to get meaningfully
# close to the turn. Expect under-resolution to stop us before the paper
# value - that is the SAN-14 regrid motivation.
[campaign]
l = 1
direction = "up"
psi0_target = 0.5          # unreachable: run until failure/steps exhausted
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 200

[seed]
policy = "from_scratch"
w0 = 0.95

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l1-up"
format = "hdf5"
