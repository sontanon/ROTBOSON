# l=2 continuation: the overnight run reached psi0=0.6 with omega still
# decreasing (0.5363); the fold (paper: 0.51657) lies beyond. Push to psi0=1.5.
[campaign]
l = 2
direction = "up"
psi0_target = 1.5
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 4000
stop_at_turning_point = false

[seed]
policy = "solution"
source = "/workspace/rotboson/out/campaigns/sweep-l2-v2/l=2,w=5.36336E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l2-cont"
format = "hdf5"
