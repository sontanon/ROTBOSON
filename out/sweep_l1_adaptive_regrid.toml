# SAN-14 validation: adaptive regrid on the high-amplitude (compact, spiky) end.
# The seed solution (ψ₀ = 0.5) has hwl = 5 < hwl_min = 8 and rr_phi_max = 0.405
# < 0.5, so the default decision table fires regrid_finer (dr ÷2, N fixed);
# the interpolated restart re-solves the same ψ₀ and the campaign continues on
# the finer grid. See SAN-14 for the recorded outcome.
[campaign]
l = 1
direction = "up"
psi0_target = 0.52
psi0_step = 0.06
psi0_step_mode = "relative"
max_steps = 2

[seed]
policy = "solution"
source = "campaigns/sweep-l1-up/l=1,w=6.53345E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[output]
root = "campaigns/sweep-l1-adaptive-regrid"
format = "hdf5"
