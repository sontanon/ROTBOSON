# ty configuration for the Python tooling under tools/ and tests/.
# `tools/` is on the module search path so tests can import sweep_driver
# directly (they extend sys.path at runtime for pytest).
[src]
include = ["tools", "tests"]

[environment]
extra-paths = ["tools"]

# Severities raised toward strict. These are the rules
# beyond ty 0.0.77's default set; every enabled rule must pass clean.
[rules]
unsound-return-statement = "error"
unsound-assignment = "error"
missing-type-argument = "error"
