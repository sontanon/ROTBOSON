name: Nightly full-resolution smoke

# The CI smoke (ci.yml) runs a coarse-grid config so PRs stay under 5 minutes.
# This workflow runs the full-resolution from-scratch smoke on both backends
# (the UMFPACK fallback alone takes ~30 min) on a schedule instead.

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch:

jobs:
  smoke-onemkl:
    name: Full-res smoke (oneMKL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/intel-oneapi.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/intel-oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/intel-oneapi.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel libhdf5-dev

      - uses: astral-sh/setup-uv@v5

      - name: Configure and build
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --preset release
          cmake --build --preset release -j2

      - name: Sync Python tooling
        run: uv sync --dev

      - name: Full-res smoke (l=1, w=0.95, from scratch)
        run: |
          source /opt/intel/oneapi/setvars.sh
          uv run tools/smoke.py out/l1_from_scratch.toml --skip-build 2>&1 | tail -20

  smoke-umfpack:
    name: Full-res smoke (UMFPACK fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev libhdf5-dev

      - uses: astral-sh/setup-uv@v5

      - name: Configure and build
        run: |
          cmake --preset umfpack
          cmake --build --preset umfpack -j2

      - name: Sync Python tooling
        run: uv sync --dev

      - name: Full-res smoke (l=1, w=0.95, from scratch)
        run: uv run tools/smoke.py out/l1_from_scratch.toml --skip-build --binary build/umfpack/ROTBOSON 2>&1 | tail -20
