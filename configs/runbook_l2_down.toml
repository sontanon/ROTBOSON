# Runbook: l=2 down-campaign — from the cross-l seed (w=0.9696)
# toward the fold. One HWL-triggered refinement that KEEPS the domain
# (N 128 -> 256; N=512 would not fit in 8 GB, hence max_refinements=1).
# stop_at_turning_point stops the campaign 1-2 steps past the vertex;
# --summarize localizes w_min (degree-4 fit, paper section IX).
#
# Run from the repo root:
#   uv run tools/sweep_driver.py configs/runbook_l2_down.toml
#   uv run tools/sweep_driver.py configs/runbook_l2_down.toml --summarize

[campaign]
l = 2
direction = "up"
psi0_target = 1.5
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 400
stop_at_turning_point = true

[adaptivity]
max_refinements = 1
refine_keeps_domain = true
hwl_min = 8

[seed]
policy = "solution"
source = "../out/campaigns/l2-seed-from-l1/l=2,w=9.69569E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "../out/campaigns/runbook-l2"
format = "hdf5"
