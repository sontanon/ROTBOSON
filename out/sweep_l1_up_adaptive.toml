# SAN-14 full-apparatus validation: the complete l=1 up-sweep (from scratch,
# through the minimum-omega turning point, up to psi0 = 0.5) with the adaptive
# layer enabled. Reference: the archived SAN-17 sweep (out/campaigns/sweep-l1-up,
# 176 steps, omega_min = 0.647077) and paper Table IX.1 (omega_min = 0.64561).
# stop_at_turning_point = false exercises fine sampling through the fold;
# the [adaptivity] defaults govern step growth/shrink and regrids.
[campaign]
l = 1
direction = "up"
psi0_target = 0.5
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 4000
stop_at_turning_point = false

[seed]
policy = "from_scratch"
w0 = 0.95

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l1-up-adaptive"
format = "hdf5"
