# RBS-NG continuation driver.
#
# Two halves live here: the pure campaign logic (SAN-60 — spec parsing,
# state.json model, adaptive decisions, fold summarize) and the vertical-
# slice runner binary (SAN-62) that drives a single solve through
# rbs-elliptic + rbs-linalg. The solver-facing campaign loop is SAN-65.
#
# Adopted as a workspace member at the PR #19 integration rebase (the
# pre-merge "standalone by design" note is history).
[package]
name = "rbs-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust port of the ROTBOSON continuation driver's pure logic (spec parsing, state.json model, adaptive decisions, fold summarize)"
publish = false

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-elliptic = { path = "../rbs-elliptic" }
rbs-linalg = { path = "../rbs-linalg" }
serde = { version = "1", features = ["derive"] }
# "preserve_order" keeps serde_json::Map keys in document order, and
# "float_roundtrip" makes float parsing correctly rounded (the default
# parser can be 1 ulp off on 16+-digit mantissas, which would break the
# byte-identical state.json round-trip). Do not drop either feature.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = "0.9"

# Inherit the workspace lint policy (port-contract allows included);
# the standalone-era omission was an integration oversight.
[lints]
workspace = true
