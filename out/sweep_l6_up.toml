# l=6 branch (up): from the mid-branch seed (omega=0.7, cross-l from l=5).
# Through the fold: turning-point detector, no regrids (domain runaway).
[campaign]
l = 6
direction = "up"
psi0_target = 0.3
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 900
stop_at_turning_point = true

[adaptivity]
max_refinements = 0

[seed]
policy = "solution"
source = "/workspace/rotboson/out/gold5/l=6,w=7.00000E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l6-up"
format = "hdf5"
