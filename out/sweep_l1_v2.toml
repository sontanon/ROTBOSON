# SAN-21 v2 validation: the full l=1 branch in one uninterrupted campaign
# (acceptance: <= 3 h) — from scratch through the minimum-omega turning point
# to psi0 = 0.5. Fixed 3% relative steps, refine-on-spikes (hwl < 8 or the
# peak closer to the axis than half its own width), verify-then-commit.
# Reference: the archived SAN-17 sweep (out/campaigns/sweep-l1-up, 176 steps,
# omega_min = 0.647077) and paper Table IX.1 (omega_min = 0.64561).
# stop_at_turning_point = false pushes through the fold to psi0 = 0.5.
[campaign]
l = 1
direction = "up"
psi0_target = 0.5
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 4000
stop_at_turning_point = false

[seed]
policy = "from_scratch"
w0 = 0.95

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l1-v2"
format = "hdf5"
