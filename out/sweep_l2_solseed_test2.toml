# Seed test: l=2 fixed-phi solve seeded from the l=1 (w=0.8996) solution.
# psi retains parity across l; only phi's r^l axis power differs.
[campaign]
l = 2
direction = "up"
psi0_target = 0.6
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 2
stop_at_turning_point = true

[seed]
policy = "solution"
source = "/workspace/rotboson/out/campaigns/sweep-l1-v2/l=1,w=8.99572E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l2-solseed-test2"
format = "hdf5"
