[workspace]
resolver = "2"
members = [
    "rbs-core",
    "rbs-elliptic",
    "rbs-linalg",
    "rbs-io",
    "rbs-driver",
    "rbs-evolve",
    "rbs-viz",
]
# Standalone spike crate (PR #21): its own [workspace] table, not a member.
# Excluded so the root workspace never tries to adopt it.
exclude = ["spikes/faer-lu"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# Transitional sparse-direct backend (N <= 128 parity gates only, ADR 0001).
faer = { version = "0.24", features = ["sparse"] }
# Optional HDF5 writer backend for rbs-io (native libhdf5 dep; off in CI).
# The `optional` flag lives on rbs-io's dependency declaration.
# NOTE: the original `hdf5` crate (0.8.1) rejects modern system HDF5
# (build.rs: "Invalid H5_VERSION: 1.14.5"), so we use the maintained fork
# under the same import name.
hdf5 = { package = "hdf5-metno", version = "0.15" }

[workspace.lints.rust]
# The ng code is pure safe Rust; any future `unsafe` (e.g. the HDF5 FFI
# wrapper) must be small, documented, and reviewed.
unsafe_code = "warn"
# Every public item carries a doc comment: the crates are the port contract.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# The grid names mirror the C oracle verbatim (NrTotal/NzTotal, dr/dz,
# dr_off/dz_off): these pairs are the port contract, not sloppiness.
similar_names = "allow"
# Grid-index -> coordinate conversions (the `i as f64` family, the C
# oracle's r = dr*(i + 0.5 - ghost) idiom) are exact by construction:
# indices are bounded far below f64's 2^52 exact-integer mantissa. Allowed
# once at workspace level rather than per line across every grid loop.
cast_precision_loss = "allow"
# The kernel/assembly side mirrors the C oracle verbatim: the C's wide
# function signatures (too_many_arguments), its single-character variable
# names (many_single_char_names — these ARE the port contract, cf. the
# grid-name note above), and its signed stencil-offset index arithmetic
# (usize <-> i64: offsets are bounded by the stencil radius, indices by
# the grid — both far inside either type on every supported target).
too_many_arguments = "allow"
many_single_char_names = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
# The driver's API surface is decision-pure by construction; the twelve
# load-bearing decision/accessor functions carry explicit #[must_use] as
# API documentation, but the remaining candidates on this port (getters,
# constructors consumed by the campaign loop and tests) are noise. The
# class kept yielding lint-by-lint, so it is allowed at workspace level.
must_use_candidate = "allow"
# The C's kernel functions are monoliths kept verbatim for line-by-line
# auditability against the oracle (too_many_lines — the entry-by-entry
# csr_vars.c diffs ARE the verification method), and its scatter loops are
# index-form over parallel stencil-weight arrays (needless_range_loop).
# Both policies are scoped to the port: revisit when genuinely-new code
# (evolution, N2 grids) isn't bound by the C's shape.
too_many_lines = "allow"
needless_range_loop = "allow"

[profile.release]
# Debug assertions stay on for parity campaigns: the oracle reproduces
# solutions to ~1e-13 and we want the same safety nets while matching it.
debug-assertions = true
