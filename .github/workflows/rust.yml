name: Rust (ng)

# The RBS-NG workspace gates (ADR 0001): build + test + clippy on ng/, plus
# the Rust codegen byte-identity gate.  Kept deliberately cheap: one Rust
# job, one uv job, no matrix, no native deps (the hdf5 feature stays off;
# its native-libhdf5 quirk is documented in ng/rbs-io/Cargo.toml).

on:
  push:
    branches:
      - master
    paths:
      - "ng/**"
      - "tools/generate_rust_kernels.py"
      - "tools/sympy_system.py"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "ng/**"
      - "tools/generate_rust_kernels.py"
      - "tools/sympy_system.py"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-ng-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Build + test + clippy (ng/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ng
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ng

      - name: Build
        run: cargo build --workspace

      - name: Unit tests (incl. kernel parity fixture)
        run: cargo test --workspace

      - name: Clippy (pedantic, warnings are errors)
        run: |
          echo "::add-matcher::.github/problem-matchers/rust-clippy.json"
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1
          status=$?
          cat clippy.log
          if [ $status -ne 0 ]; then
            python3 - <<'PY'
import re
msg = None
seen = 0
for line in open("clippy.log", errors="replace"):
    m = re.match(r"^(?:error|warning)(?:\[[^]]*\])?: (.*)$", line.rstrip())
    if m:
        msg = m.group(1)
        continue
    m2 = re.match(r"^\s*--> ([^:\s]+):(\d+):(\d+)", line)
    if m2 and msg:
        path = m2.group(1)
        if not path.startswith("ng/"):
            path = "ng/" + path
        print(f"::error file={path},line={m2.group(2)},col={m2.group(3)}::{msg[:240]}")
        msg = None
        seen += 1
        if seen >= 10:
            break
PY
          fi
          exit $status

  codegen-gate:
    name: Rust kernels == checked-in generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Sync Python tooling
        run: uv sync --dev

      # Mirrors the C gate (`generate_kernels.py --check` in ci.yml): the
      # checked-in kernels.rs and parity fixture must be exactly what the
      # SymPy chain regenerates.
      - name: Regenerated Rust kernels == checked-in
        run: uv run tools/generate_rust_kernels.py --check
