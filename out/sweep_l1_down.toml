# l=1 down-sweep toward the Newtonian end (omega -> m = 1, M_Komar -> 0).
# Wider domain: the weak field spreads; paper physics needs r_bdy >> field width.
[campaign]
l = 1
direction = "down"
psi0_target = 1.0e-5
psi0_step = 0.06
psi0_step_mode = "relative"
max_retries = 4
max_steps = 120

[seed]
policy = "from_scratch"
w0 = 0.95

[grid]
dr = 0.25
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l1-down"
format = "hdf5"
