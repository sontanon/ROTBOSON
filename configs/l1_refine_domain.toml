# l=1 domain-keeping refinement demo.
#
# Exercises the N×2 refinement end-to-end: the seed is re-solved at its own
# ψ₀ on N=256/dr=0.0625 with the domain KEPT at 16.4 — the exact regrid the
# legacy fixed-N ladder would SKIP (the support r99≈15.7 would "not fit" in
# the shrunk 8.25 boundary). hwl_min=200 forces the refinement trigger (the
# field's half-width is ~85 points); max_refinements=1 bounds it.
#
# Run from the repo root (after configs/l1_seed.toml has produced its
# solution dir under out/):
#   uv run tools/sweep_driver.py configs/l1_refine_domain.toml
#
# Expected: seed step → one solve at the seed's ψ₀ (dr=0.125) → regrid
# "dr 1.25E-01 → 6.25E-02 (N 128 → 256, domain kept) accepted" → done.

[campaign]
l = 1
direction = "up"
psi0_target = 0.00283882887900032
psi0_step = 0.03
psi0_step_mode = "relative"
max_steps = 3
stop_at_turning_point = false

[adaptivity]
hwl_min = 200
max_refinements = 1
refine_keeps_domain = true

[seed]
policy = "solution"
source = "../out/l=1,w=9.50000E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "../out/campaigns/l1-refine-domain"
format = "hdf5"
