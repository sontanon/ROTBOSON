# SAN-14 validation: turning-point detection (design §6.2).
# Seeds just before the branch minimum (ω_min at ψ₀ ≈ 0.362 on this grid);
# stop_at_turning_point defaults to true, so the campaign stops with
# status "stopped:turning_point" once dω/dψ₀ changes sign. Adaptivity knobs
# are loosened here to keep the campaign on dr = 0.125 (the regrid path is
# exercised by out/sweep_l1_adaptive_regrid.toml).
[campaign]
l = 1
direction = "up"
psi0_target = 0.6
psi0_step = 0.06
psi0_step_mode = "relative"
max_steps = 6

[seed]
policy = "solution"
source = "campaigns/sweep-l1-up/l=1,w=6.47258E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[adaptivity]
hwl_min = 1
rr_phi_max_min = 0.01

[output]
root = "campaigns/sweep-l1-turning-point"
format = "hdf5"
