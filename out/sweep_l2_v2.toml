# l=2 branch campaign (SAN-16 groundwork): span omega = 0.9 through the
# omega_min turning point (paper Table IX.1: 0.51657) and push through to
# psi0 = 0.6 for the far side of the branch.
#
# Seed: standalone from-scratch l=2 solve at fixed w = 0.9 with a dilute
# ansatz (psi0 = 0.003; 0.01 diverges into PARDISO -4, 0.001 slides into the
# trivial flat solution, 0.003/0.005 both converge to the same star:
# M_Komar = 1.5184, J_Komar = 3.1038, GRV2 = -2.3e-3, r99 = 15.5, HWL = 71).
# See out/l2_seedrun/. Cross-l seeding from the l=1 (w=0.9) solution was
# also tried (driver fixed-phi step + standalone fixed-omega relax) and
# stalls/diverges — not used.
[campaign]
l = 2
direction = "up"
psi0_target = 0.6
psi0_step = 0.03
psi0_step_mode = "relative"
max_retries = 4
max_steps = 4000
stop_at_turning_point = false

[seed]
policy = "solution"
source = "/workspace/rotboson/out/l2_seedrun/l=2,w=9.00000E-01,dr=1.25000E-01,N=0128"

[grid]
dr = 0.125
N = 128

[solver]
maxNewtonIter = 60

[output]
root = "/workspace/rotboson/out/campaigns/sweep-l2-v2"
format = "hdf5"
